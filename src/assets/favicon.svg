<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123024"/>
      <stop offset="1" stop-color="#0B231C"/>
    </linearGradient>
  </defs>

  <!-- board background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="100" fill="none" stroke="#C97B3E" stroke-opacity="0.35" stroke-width="6"/>

  <!-- pins: left -->
  <line x1="60"  y1="176" x2="146" y2="176" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <line x1="60"  y1="256" x2="146" y2="256" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <line x1="60"  y1="336" x2="146" y2="336" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <!-- pins: right -->
  <line x1="366" y1="176" x2="452" y2="176" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <line x1="366" y1="256" x2="452" y2="256" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <line x1="366" y1="336" x2="452" y2="336" stroke="#C97B3E" stroke-width="14" stroke-linecap="round"/>
  <!-- pin pads -->
  <circle cx="60"  cy="176" r="11" fill="#C97B3E"/>
  <circle cx="60"  cy="256" r="11" fill="#C97B3E"/>
  <circle cx="60"  cy="336" r="11" fill="#C97B3E"/>
  <circle cx="452" cy="176" r="11" fill="#C97B3E"/>
  <circle cx="452" cy="256" r="11" fill="#C97B3E"/>
  <circle cx="452" cy="336" r="11" fill="#C97B3E"/>

  <!-- chip body -->
  <rect x="146" y="146" width="220" height="220" rx="28" fill="#0B231C" stroke="#E8A356" stroke-width="10"/>

  <!-- center D mark (DevStore) -->
  <path d="M226 196 h34 c36 0 60 26 60 60 s-24 60 -60 60 h-34 z"
        fill="none" stroke="#E8A356" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
